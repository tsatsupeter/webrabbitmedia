name: Deploy (mirror to webrabbitmedia → Cloudflare Pages)

# Cloudflare Pages auto-deploys the tsatsupeter/webrabbitmedia repo
# (webrabbitmedia.com). This workflow keeps that repo in sync with main
# here, so every commit — including Lovable edits — goes live.
#
# Lovable edits package.json with bun and never updates package-lock.json,
# and Cloudflare's build runs `npm ci`, which hard-fails on a stale lock.
# So this job runs `npm install` on Linux (same platform as Cloudflare,
# which also matters for npm's platform-specific optional deps), commits
# the refreshed lockfile back when it drifts, and only then mirrors.
#
# Auth: MIRROR_SSH_KEY secret, paired with a write deploy key on the
# webrabbitmedia repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mirror
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    # Guard: this file gets mirrored into tsatsupeter/webrabbitmedia, where
    # it must not run (no secrets there; Actions are disabled as well).
    if: github.repository == 'tsatsupeter/WEBRABBITMEDIA-COMPANY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit lockfile sync if package.json drifted
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package-lock.json with package.json [skip ci]"
            # Tolerate a race with a concurrent Lovable push; the next run re-syncs.
            git push origin main || echo "push-back skipped: main moved"
          fi
      - name: Push to deploy mirror
        env:
          SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git push --force git@github.com:tsatsupeter/webrabbitmedia.git HEAD:main

  # Deploys worker/ (api.webrabbitmedia.com) whenever it changes.
  # Needs a CLOUDFLARE_API_TOKEN repo secret ("Edit Cloudflare Workers"
  # token template); until it exists this job warns and skips.
  worker:
    if: github.repository == 'tsatsupeter/WEBRABBITMEDIA-COMPANY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker if changed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set; skipping worker deploy"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] && git diff --quiet HEAD^ HEAD -- worker/; then
            echo "worker/ unchanged; skipping deploy"
            exit 0
          fi
          cd worker
          npm install --no-audit --no-fund
          npx wrangler deploy
